global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    option httplog
    timeout connect 10s
    timeout client 10m
    timeout server 10m

frontend vllm_frontend
    bind *:8080
    default_backend vllm_replicas

backend vllm_replicas
    balance leastconn
    option httpchk GET /health
    server spark1 127.0.0.1:8000 check
    server spark2 ${NODE2_BENCH_HOST:-node2}:8000 check
